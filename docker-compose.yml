version: '3.8'

services:
  database:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: tododb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"

  backend:
    build: .
    depends_on:
      - database
    environment:
      DATABASE_URL: jdbc:mysql://database:3306/tododb
      DATABASE_USER: user
      DATABASE_PASSWORD: password
    command: ["java", "-jar", "/app/app.jar"]